name: qwen_edit_2509_lora
mode: lora
runtime:
  python_executable: python
  accelerate_executable: accelerate
  working_dir: third_party/diffsynth-studio
  env_file: configs/env/train.env.example
  dry_run: false
model:
  model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
  torch_dtype: auto
  tokenizer_path: null
  processor_path: null
  zero_cond_t: false
  remove_prefix_in_ckpt: pipe.dit.
dataset:
  dataset_base_path: data/processed/train
  dataset_metadata_path: data/manifests/train_metadata_qwen_edit.json
  data_file_keys: image,edit_image
  extra_inputs: edit_image
  max_pixels: 1048576
  dataset_repeat: 1
  dataset_num_workers: 4
training:
  learning_rate: 1.0e-4
  num_epochs: 5
  use_gradient_checkpointing: true
  find_unused_parameters: true
  gradient_accumulation_steps: 1
  height: null
  width: null
output:
  output_path: outputs/checkpoints/Qwen-Image-Edit-2509_lora
  command_file: outputs/logs/train_lora_command.txt
  log_dir: outputs/logs
lora:
  lora_base_model: dit
  lora_target_modules: to_q,to_k,to_v,add_q_proj,add_k_proj,add_v_proj,to_out.0,to_add_out,img_mlp.net.2,img_mod.1,txt_mlp.net.2,txt_mod.1
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null
resume:
  enabled: false
  extra_args: []
extra_args: []
validation:
  prompt: Change the color of the dress in Figure 1 to the color shown in Figure 2.
  edit_images: []
  seed: 123
  height: 1024
  width: 1024
  num_inference_steps: 40
  negative_prompt: " "
