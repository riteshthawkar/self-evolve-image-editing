name: qwen_edit_2509_full
mode: full
runtime:
  python_executable: python
  accelerate_executable: accelerate
  working_dir: third_party/diffsynth-studio
  env_file: configs/env/train.env.example
  dry_run: false
  accelerate_config_file: examples/qwen_image/model_training/full/accelerate_config_zero2offload.yaml
model:
  model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
  torch_dtype: auto
  tokenizer_path: null
  processor_path: null
  zero_cond_t: false
  remove_prefix_in_ckpt: pipe.dit.
dataset:
  dataset_base_path: data/processed/train
  dataset_metadata_path: data/manifests/train_metadata_qwen_edit.json
  data_file_keys: image,edit_image
  extra_inputs: edit_image
  max_pixels: 1048576
  dataset_repeat: 1
  dataset_num_workers: 4
training:
  learning_rate: 1.0e-5
  num_epochs: 2
  use_gradient_checkpointing: true
  find_unused_parameters: true
  gradient_accumulation_steps: 1
  trainable_models: dit
  height: null
  width: null
output:
  output_path: outputs/checkpoints/Qwen-Image-Edit-2509_full
  command_file: outputs/logs/train_full_command.txt
  log_dir: outputs/logs
resume:
  enabled: false
  extra_args: []
extra_args: []
validation:
  prompt: Change the color of the dress in Figure 1 to the color shown in Figure 2.
  edit_images: []
  seed: 123
  height: 1024
  width: 1024
  num_inference_steps: 40
  negative_prompt: " "
