name: self_evolve_qwen_edit_2509_conservative_pairwise_v1
runtime:
  seed: 123
  dry_run: false
  memory_log_enabled: true
  release_proposer_before_generation: false
dataset:
  source: jsonl
  manifest_jsonl: data/unlabeled/selected/magicbrush_all_images_moe/manifest_balanced_object_color_background_rounds256.jsonl
  metadata_jsonl: null
  limit: null
proposer:
  backend: trainable_qwen_image_edit
  model_name_or_path: Qwen/Qwen-Image-Edit-2509
  model_subfolder: text_encoder
  processor_subfolder: processor
  model_class: qwen2_5_vl
  checkpoint_path: null
  device: auto
  torch_dtype: bfloat16
  local_files_only: false
  fallback_on_error: false
  scripted_probability: 0.35
  family_policy: metadata_preferred
  focus_edit_types:
    - object_removal
    - object_replacement
    - object_addition
    - attribute_change
    - color_change
    - material_change
    - spatial_move
    - background_change
    - style_transfer
    - local_enhancement
  coverage_edit_types:
    - object_removal
    - object_replacement
    - object_addition
    - attribute_change
    - color_change
    - material_change
    - spatial_move
    - background_change
    - style_transfer
    - local_enhancement
  coverage_guidance: "Prefer visually checkable, medium-difficulty edits across the scheduled edit types. Preserve source identity and non-target regions, and avoid collapsing to any single easy edit family."
  avoid_edit_types:
    - global_adjustment
  enforce_record_target_edit_type: true
  strict_edit_type_filter: true
  template_fallback_on_target_miss: true
  template_bootstrap_rounds: 1
  max_generation_attempts: 1
  generation:
    max_new_tokens: 512
    temperature: 0.8
    top_p: 0.9
    do_sample: true
  training:
    trigger: launch
    train_script: src/qwen_edit_project/train/train_proposer_lora.py
    accelerate_executable: accelerate
    output_dir: null
    command_file: null
    log_dir: null
    mixed_precision: bf16
    learning_rate: 1.0e-5
    num_train_epochs: 1
    max_train_steps: null
    train_batch_size: 1
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0
    weight_decay: 0.01
    seed: 123
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
    gradient_checkpointing: true
    checkpointing_steps: 100
    checkpoints_total_limit: 5
    resume_from_latest: true
    logging_steps: 10
    data:
      reward_center: 0.50
      reward_sigma: 0.25
      min_reward: 0.35
      min_quality: 0.30
      reference_roles:
        - reference:base
      policy_roles:
        - policy
      base_improvement_weight: 0.20
      base_harm_penalty: 0.60
      base_margin_center: 0.03
      require_judge_for_success: true
      min_judge_score: 0.55
      min_judge_semantic: 0.55
      min_judge_preservation: 0.55
      min_judge_artifact_free: 0.55
      all_fail_penalty: 0.25
      all_pass_penalty: 0.25
      all_pass_threshold: 0.95
      require_productive_band_for_sft: true
      min_success_rate_for_sft: 0.20
      max_success_rate_for_sft: 0.80
editor:
  backend: qwen_edit
  device: auto
  drop_generation_modules_for_scoring: false
  generation:
    seed: 42
    num_inference_steps: 40
    true_cfg_scale: 4.0
    guidance_scale: 1.0
    negative_prompt: " "
    num_images_per_prompt: 1
    preserve_input_resolution: false
    object_removal_prompt_variants:
      enabled: true
  model:
    backend: official_diffusers
    base_model: Qwen/Qwen-Image-Edit-2509
    model_type: base
    checkpoint_path: null
    processor_model_id: Qwen/Qwen-Image-Edit
    torch_dtype: bfloat16
    local_files_only: false
    model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
candidate_generation:
  samples_per_proposal: 4
  samples_per_proposal_by_edit_type:
    object_removal: 12
    object_replacement: 8
  seed_stride: 7919
  reference_candidates:
    enabled: true
    start_round: 1
    source: initial
    samples_per_proposal: 1
    candidate_index_offset: 2000
    seed_offset: 1200000000
    candidate_role: reference:base
  self_play:
    enabled: true
    start_round: 2
    opponent: previous_round
    samples_per_proposal: 2
    candidate_index_offset: 1000
    seed_offset: 900000000
    candidate_role: opponent:previous_round
evaluator:
  backend: internal_cepr_rubric
  top_m: 2
  # The rubric CEPR backend already uses Qwen internal edit-understanding,
  # taxonomy, preservation, and latent-locality features. Keep the calibration
  # generic and do not add benchmark-specific task/language weights here.
  counterfactual_distractors: 4
  edit_threshold: 0.40
  preservation_threshold: 0.20
  validity_threshold: 0.50
  reward_threshold: 0.30
  edit_temperature: 0.04
  true_gain_temperature: 0.04
  min_true_gain: 0.0
  semantic_preservation_temperature: 0.08
  latent_resolution: 512
  latent_mask_std_scale: 0.75
  latent_mask_min_delta: 0.03
  latent_preservation_temperature: 0.30
  max_total_latent_delta: 0.45
  latent_drift_temperature: 0.15
  taxonomy_enabled: true
  taxonomy_required: true
  taxonomy_threshold: 0.35
  taxonomy_temperature: 0.06
  taxonomy_source_drop_temperature: 0.06
  taxonomy_distractor_temperature: 0.05
  max_dynamic_distractors: 4
  empty_cache_per_candidate: true
  retry_cpu_on_oom: true
  require_internal_components: true
  rubric_source_threshold: 0.42
  rubric_required_threshold: 0.45
  rubric_forbidden_threshold: 0.42
  rubric_preservation_threshold: 0.30
  rubric_reward_threshold: 0.28
  rubric_gain_temperature: 0.06
  rubric_abs_temperature: 0.08
  rubric_preservation_temperature: 0.20
  rubric_support_center: 0.50
  rubric_forbidden_absence_center: 0.52
  max_rubric_items: 3
  combine_cepr_semantics: true
  rubric_soft_forbidden_edit_types:
    - object_removal
    - object_replacement
  rubric_soft_forbidden_required_threshold: 0.65
  rubric_soft_forbidden_reward_threshold: 0.25
  rubric_soft_forbidden_preservation_threshold: 0.85
  object_detector_enabled: true
  object_detector_edit_types:
    - object_removal
    - object_replacement
  object_detector_model_id: IDEA-Research/grounding-dino-tiny
  object_detector_device: auto
  object_detector_torch_dtype: auto
  object_detector_box_threshold: 0.22
  object_detector_text_threshold: 0.18
  object_detector_original_min_score: 0.18
  object_detector_edited_absent_max_score: 0.12
  object_detector_absent_ratio: 0.55
  object_detector_target_min_score: 0.18
  object_detector_score_threshold: 0.45
  object_detector_score_temperature: 0.05
  object_detector_require_original_detection: true
  conservative_region_reward_enabled: true
  conservative_region_edit_types:
    - object_removal
    - object_replacement
    - color_change
    - attribute_change
    - material_change
    - local_enhancement
  conservative_region_require_mask_edit_types:
    - object_removal
    - object_replacement
  conservative_region_use_object_detector: true
  conservative_region_fallback_to_diff_mask: true
  conservative_region_diff_fallback_allows_gate: false
  conservative_region_mask_size: 128
  conservative_region_mask_padding_fraction: 0.05
  conservative_region_diff_threshold: 18
  conservative_region_diff_dilation_radius: 1
  conservative_region_min_target_area: 0.0025
  conservative_region_max_target_area: 0.65
  conservative_region_max_detector_boxes: 3
  conservative_region_min_target_change: 0.020
  conservative_region_min_target_change_score: 0.35
  conservative_region_target_change_temperature: 0.025
  conservative_region_max_outside_change: 0.070
  conservative_region_outside_change_temperature: 0.035
  conservative_region_max_outside_changed_fraction: 0.45
  conservative_region_min_localization_precision: 0.30
  conservative_region_min_outside_preservation: 0.50
  conservative_region_min_reward: 0.30
  internal_vlm_judge:
    enabled: true
    mode: per_candidate
    max_candidates: 20
    image_resolution: 512
    max_new_tokens: 768
    temperature: 0.0
    top_p: 0.9
    cepr_weight: 0.45
    judge_weight: 0.55
    min_score_for_feasible: 0.35
    min_semantic_for_feasible: 0.35
    min_preservation_for_feasible: 0.35
    min_artifact_free_for_feasible: 0.35
    min_confidence: 0.25
    require_for_feasible: true
    require_confidence_for_feasible: false
    use_unreliable_scores: true
    fail_closed_on_low_score: true
    missing_score_is_failure: true
    fail_open: false
curriculum:
  num_rounds: auto
  record_schedule: stratified_metadata
  stratify_metadata_key: primary_family
  stratify_targets:
    object: 0.50
    color: 0.25
    background: 0.25
  stratify_shuffle_seed: 123
  proposals_per_image: 1
  inject_scheduled_edit_type: true
  coverage_schedule_mode: global_cycle
  coverage_edit_type_schedule:
    - object_removal
    - object_replacement
    - object_addition
    - attribute_change
    - color_change
    - material_change
    - spatial_move
    - background_change
    - style_transfer
    - local_enhancement
  initial_level: 2
  min_level: 1
  max_level: 3
  promote_at: 0.65
  demote_at: 0.25
  max_records_per_round: 12
training:
  trigger: launch
  base_train_config: configs/train/lora_2509_diffusers.yaml
  current_checkpoint_path: null
  continue_with_trained_checkpoint: true
  trained_checkpoint_backend: official_diffusers
  resume_from_latest: true
  # Fast-pilot defaults. Increase rank/modules after reward traces look correct.
  learning_rate: 1.5e-6
  num_epochs: 1
  max_train_steps: 64
  gradient_accumulation_steps: 1
  checkpointing_steps: 0
  offload: false
