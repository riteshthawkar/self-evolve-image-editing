name: self_evolve_qwen_edit_2509_internal_cepr
runtime:
  seed: 123
  dry_run: false
dataset:
  source: directory
  images_dir: data/unlabeled/self_evolve
  metadata_jsonl: null
  limit: null
proposer:
  backend: scripted
  family_policy: metadata_preferred
  families:
    - exposure
    - color
    - contrast
    - tone
    - style
    - background
    - local
    - detail
editor:
  backend: qwen_edit
  device: auto
  generation:
    seed: 42
    num_inference_steps: 40
    true_cfg_scale: 4.0
    guidance_scale: 1.0
    negative_prompt: " "
    num_images_per_prompt: 1
    preserve_input_resolution: false
  model:
    backend: official_diffusers
    base_model: Qwen/Qwen-Image-Edit-2509
    model_type: base
    checkpoint_path: null
    processor_model_id: Qwen/Qwen-Image-Edit
    torch_dtype: bfloat16
    local_files_only: false
    model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
candidate_generation:
  samples_per_proposal: 4
  seed_stride: 7919
solver:
  backend: internal_cepr
  top_m: 1
  counterfactual_distractors: 4
  edit_threshold: 0.53
  preservation_threshold: 0.60
  validity_threshold: 0.35
  reward_threshold: 0.52
  edit_temperature: 0.04
  true_gain_temperature: 0.04
  min_true_gain: 0.0
  semantic_preservation_temperature: 0.08
  latent_resolution: 512
  latent_mask_std_scale: 0.75
  latent_mask_min_delta: 0.03
  latent_preservation_temperature: 0.12
  max_total_latent_delta: 0.45
  latent_drift_temperature: 0.15
  require_internal_components: true
curriculum:
  num_rounds: 2
  proposals_per_image: 1
  initial_level: 1
  min_level: 1
  max_level: 3
  promote_at: 0.70
  demote_at: 0.35
  max_records_per_round: 512
training:
  trigger: emit_only
  base_train_config: configs/train/lora_2509.yaml
  current_checkpoint_path: null
  reconstruction_replay_ratio: 0.15
  reconstruction_replay_prompt: Reconstruct the input image exactly. Preserve all content, layout, colors, and text.
output:
  root_dir: outputs/self_evolve/qwen_edit_2509_internal_cepr
  save_all_candidates: true
  use_cumulative_manifest: true
  write_evaluator_training: true
