name: self_evolve_qwen_edit_2509_internal_cepr_trainable_proposer
runtime:
  seed: 123
  dry_run: false
  memory_log_enabled: true
dataset:
  source: directory
  images_dir: data/unlabeled/self_evolve
  metadata_jsonl: null
  limit: null
proposer:
  backend: trainable_qwen_image_edit
  model_name_or_path: Qwen/Qwen-Image-Edit-2509
  model_subfolder: text_encoder
  processor_subfolder: processor
  model_class: qwen2_5_vl
  checkpoint_path: null
  device: auto
  torch_dtype: bfloat16
  local_files_only: false
  fallback_on_error: false
  # Keep a small scripted mixture early so the proposer cannot collapse before it has rewards.
  scripted_probability: 0.20
  family_policy: metadata_preferred
  generation:
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.9
    do_sample: true
  training:
    # Use "launch" on the remote GPU machine. "emit_only" writes the exact command and data.
    trigger: emit_only
    train_script: src/qwen_edit_project/train/train_proposer_lora.py
    accelerate_executable: accelerate
    output_dir: null
    command_file: null
    log_dir: null
    mixed_precision: bf16
    learning_rate: 1.0e-5
    num_train_epochs: 1
    max_train_steps: null
    train_batch_size: 1
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0
    weight_decay: 0.01
    seed: 123
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
    gradient_checkpointing: true
    checkpointing_steps: 100
    checkpoints_total_limit: 5
    resume_from_latest: true
    logging_steps: 10
    data:
      reward_center: 0.50
      reward_sigma: 0.25
      min_reward: 0.35
      min_quality: 0.30
editor:
  backend: qwen_edit
  device: auto
  generation:
    seed: 42
    num_inference_steps: 40
    true_cfg_scale: 4.0
    guidance_scale: 1.0
    negative_prompt: " "
    num_images_per_prompt: 1
    preserve_input_resolution: false
  model:
    backend: official_diffusers
    base_model: Qwen/Qwen-Image-Edit-2509
    model_type: base
    checkpoint_path: null
    processor_model_id: Qwen/Qwen-Image-Edit
    torch_dtype: bfloat16
    local_files_only: false
    model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
candidate_generation:
  samples_per_proposal: 4
  seed_stride: 7919
evaluator:
  backend: internal_cepr
  top_m: 1
  counterfactual_distractors: 4
  edit_threshold: 0.45
  preservation_threshold: 0.20
  validity_threshold: 0.50
  reward_threshold: 0.30
  edit_temperature: 0.04
  true_gain_temperature: 0.04
  min_true_gain: 0.0
  semantic_preservation_temperature: 0.08
  latent_resolution: 512
  latent_mask_std_scale: 0.75
  latent_mask_min_delta: 0.03
  latent_preservation_temperature: 0.30
  max_total_latent_delta: 0.45
  latent_drift_temperature: 0.15
  taxonomy_enabled: true
  taxonomy_required: true
  taxonomy_threshold: 0.40
  taxonomy_temperature: 0.06
  taxonomy_source_drop_temperature: 0.06
  taxonomy_distractor_temperature: 0.05
  max_dynamic_distractors: 4
  empty_cache_per_candidate: true
  retry_cpu_on_oom: true
  require_internal_components: true
curriculum:
  num_rounds: auto
  record_schedule: sequential_shards
  proposals_per_image: 1
  initial_level: 2
  min_level: 1
  max_level: 3
  promote_at: 0.65
  demote_at: 0.25
  max_records_per_round: 8
training:
  trigger: emit_only
  base_train_config: configs/train/lora_2509_diffusers.yaml
  current_checkpoint_path: null
  continue_with_trained_checkpoint: true
  trained_checkpoint_backend: official_diffusers
  resume_from_latest: true
  weighted_sft:
    enabled: true
    include_rejected: true
    accepted_weight: 1.0
    min_rejected_weight: 0.05
    max_rejected_weight: 0.50
    min_raw_reward: 0.15
    target_reward: 0.30
    min_semantic_edit: 0.225
    min_preservation: 0.20
    min_validity: 0.50
    score_power: 1.0
  reconstruction_replay_ratio: 0.15
  reconstruction_replay_weight: 0.50
  reconstruction_replay_prompt: Reconstruct the input image exactly. Preserve all content, layout, colors, and text.
output:
  root_dir: outputs/self_evolve/qwen_edit_2509_internal_cepr_trainable_proposer
  save_all_candidates: true
  use_cumulative_manifest: false
  write_evaluator_training: true
  resume:
    enabled: true
    progress_log_every: 10
