name: self_evolve_qwen_edit_2509_delta_results
runtime:
  seed: 123
  dry_run: false
dataset:
  source: directory
  images_dir: data/unlabeled/self_evolve
  metadata_jsonl: null
  limit: null
proposer:
  backend: scripted
  family_policy: metadata_preferred
  families:
    - exposure
    - color
    - contrast
    - tone
    - style
  operation_ids:
    - brightness_up
    - brightness_down
    - saturation_up
    - saturation_down
    - contrast_up
    - contrast_down
    - warm_tone
    - cool_tone
    - grayscale
editor:
  backend: qwen_edit
  device: auto
  generation:
    seed: 42
    num_inference_steps: 40
    true_cfg_scale: 4.0
    guidance_scale: 1.0
    negative_prompt: " "
    num_images_per_prompt: 1
    preserve_input_resolution: false
  model:
    backend: official_diffusers
    base_model: Qwen/Qwen-Image-Edit-2509
    model_type: base
    checkpoint_path: null
    processor_model_id: Qwen/Qwen-Image-Edit
    torch_dtype: bfloat16
    local_files_only: false
    model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
candidate_generation:
  samples_per_proposal: 4
  seed_stride: 7919
solver:
  backend: hard_gated_relative
  global_weight: 0.7
  local_weight: 0.3
  proxy_weight: 0.55
  spatial_weight: 0.25
  cycle_weight: 0.0
  internal_weight: 0.20
  require_internal_when_weighted: true
  internal_instruction_weight: 0.65
  internal_prompt_gain_scale: 0.08
  internal_neutral_score: 0.0
  acceptance_threshold: 0.72
  instruction_threshold: 0.66
  preservation_threshold: 0.72
  quality_threshold: 0.55
  max_disagreement: 0.30
  top_m: 1
  counterfactual_distractors: 3
  counterfactual_backend: proxy
  rank_spatial_weight: 0.35
  rank_counterfactual_weight: 0.30
  rank_relative_weight: 0.25
  rank_cycle_weight: 0.00
  rank_internal_weight: 0.10
curriculum:
  num_rounds: 2
  proposals_per_image: 1
  initial_level: 1
  min_level: 1
  max_level: 3
  promote_at: 0.70
  demote_at: 0.35
  max_records_per_round: 512
training:
  trigger: emit_only
  base_train_config: configs/train/lora_2509.yaml
  current_checkpoint_path: null
  continue_with_trained_checkpoint: true
  trained_checkpoint_backend: diffsynth
  reconstruction_replay_ratio: 0.15
  reconstruction_replay_prompt: Reconstruct the input image exactly. Preserve all content, layout, colors, and text.
output:
  root_dir: outputs/self_evolve/qwen_edit_2509_delta_results
  save_all_candidates: true
  use_cumulative_manifest: true
  write_evaluator_training: true
  train_verifiers:
    - proxy
