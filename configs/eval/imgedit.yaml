name: qwen_edit_2509_base
benchmark: imgedit
runtime:
  python_executable: python
  env_file: configs/env/eval.env.example
  dry_run: false
  log_dir: outputs/logs
model:
  model_type: base
  base_model: Qwen/Qwen-Image-Edit-2509
  checkpoint_path: null
  model_name: qwen_edit_2509_base
  torch_dtype: auto
  model_id_with_origin_paths: Qwen/Qwen-Image-Edit-2509:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors
dataset:
  edit_json: data/processed/benchmark/imgedit/basic_edit.json
  origin_img_root: data/processed/benchmark/imgedit/original_images
  prompts_json: third_party/imgedit/Benchmark/Basic/prompts.json
generation:
  seed: 42
  num_inference_steps: 28
  true_cfg_scale: 4.0
  guidance_scale: 1.0
  negative_prompt: " "
output:
  edited_images_dir: outputs/benchmark_images/imgedit
  scores_dir: outputs/scores/imgedit
  summary_path: outputs/scores/imgedit/qwen_edit_2509_base_summary.json
scoring:
  num_processes: 4
prompting:
  use_prompt_polish: false
