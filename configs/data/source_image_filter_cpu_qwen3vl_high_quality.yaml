name: source_image_filter_cpu_qwen3vl_high_quality
input:
  source: directory
  images_dir: data/unlabeled/raw/coco2017
vlm:
  backend: qwen_vl
  model_id: /share_6/users/ritesh_thawkar/hf_cache/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  device: cpu
  torch_dtype: bfloat16
  max_new_tokens: 320
  temperature: 0.0
  padding_side: left
  processor_max_pixels: 131072
selection:
  max_selected: 1200
  min_average_hash_distance: 7
  max_family_fraction: 0.70
  target_family_fractions:
    object: 0.65
    background: 0.20
    color: 0.15
  primary_family_priority:
    - object
    - background
    - color
  family_thresholds:
    object:
      min_object_region_clarity: 0.62
      min_editable_content_score: 0.65
      min_removable_object_score: 0.55
      min_small_object_separability: 0.55
      min_removal_background_fill_score: 0.50
  batch_size: 1
  progress_every: 1
  resume_scored: true
  stream_scores: true
  thresholds:
    min_short_side: 384
    max_aspect_ratio: 2.3
    min_technical_quality: 0.48
    min_vlm_quality: 0.62
    min_natural_image: 0.62
    min_editable_content: 0.66
    min_object_region_clarity: 0.56
    min_removable_object_score: 0.45
    min_small_object_separability: 0.45
    min_removal_background_fill_score: 0.42
    min_preservation_potential: 0.62
    min_edit_families: 1
    max_clutter_penalty: 0.58
    max_text_watermark_penalty: 0.25
    # CPU Qwen3-VL scores are systematically lower under the weighted penalty
    # normalizer; keep object/preservation gates strict and calibrate this floor
    # from the smoke run so strong object cases are not rejected only by scale.
    min_total_score: 0.68
  weights:
    technical_quality: 0.14
    vlm_quality: 0.12
    natural_image: 0.10
    editable_content: 0.18
    object_region_clarity: 0.16
    removable_object_score: 0.12
    small_object_separability: 0.10
    removal_background_fill_score: 0.10
    preservation_potential: 0.18
    edit_family_coverage: 0.06
    clutter_penalty: 0.10
    text_watermark_penalty: 0.12
output:
  selected_manifest_jsonl: data/unlabeled/selected/coco2017_cpu_qwen3vl_high_quality_v1/manifest.jsonl
  rejected_manifest_jsonl: data/unlabeled/selected/coco2017_cpu_qwen3vl_high_quality_v1/rejected.jsonl
  score_jsonl: data/unlabeled/selected/coco2017_cpu_qwen3vl_high_quality_v1/scores.jsonl
  summary_json: data/unlabeled/selected/coco2017_cpu_qwen3vl_high_quality_v1/selection_summary.json
  materialize_mode: none
  selected_images_dir: data/unlabeled/selected/coco2017_cpu_qwen3vl_high_quality_v1/images
