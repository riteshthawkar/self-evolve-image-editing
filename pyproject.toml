[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-edit-project"
version = "0.1.0"
description = "Baseline training and evaluation framework for Qwen-Image-Edit research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "numpy>=1.24",
  "datasets>=2.20",
]

[project.optional-dependencies]
vlm = [
  "accelerate>=0.33",
  "torch>=2.3",
  "transformers>=4.51",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
